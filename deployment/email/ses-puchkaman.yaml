AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  SES sending identity for puchkaman.ca: an EasyDKIM-signed domain identity with
  a custom MAIL FROM subdomain (mail.puchkaman.ca) for SPF alignment. puchkaman.ca
  is hosted in Route 53, so UNLIKE tiffingrab this stack ALSO creates the DNS
  records (3 DKIM CNAMEs + MAIL FROM MX/SPF) directly in the hosted zone. The apex
  SPF/MX (PrivateEmail) is untouched — SES uses the mail.* subdomain envelope.

Parameters:
  DomainName:
    Type: String
    Default: puchkaman.ca
    AllowedPattern: "^[a-z0-9.-]+\\.[a-z]{2,}$"
  MailFromSubdomain:
    Type: String
    Default: mail
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route 53 hosted zone for the domain (auto-adds DKIM + MAIL FROM records).
  ConfigurationSetName:
    Type: String
    Default: puchkaman-prod
  WebhookEndpoint:
    Type: String
    Default: https://puchkaman.ca/api/webhooks/ses
    Description: HTTPS endpoint SNS delivers bounce/complaint feedback to. Must be LIVE before deploy — SNS auto-confirms the subscription on create.

Resources:
  Identity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref DomainName
      DkimSigningAttributes:
        NextSigningKeyLength: RSA_2048_BIT
      MailFromAttributes:
        BehaviorOnMxFailure: REJECT_MESSAGE
        MailFromDomain: !Sub "${MailFromSubdomain}.${DomainName}"
      ConfigurationSetAttributes:
        ConfigurationSetName: !Ref ConfigurationSet

  ConfigurationSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: !Ref ConfigurationSetName

  # --- Bounce/complaint feedback ---
  # Deliberately declared HERE rather than in a copy of ses-suppression.yaml:
  # that template declares its own AWS::SES::ConfigurationSet, and a second
  # stack creating puchkaman-prod would collide with the one above.
  FeedbackTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: puchkaman-ses-feedback

  # SES must be allowed to publish to the topic; scope to this account.
  FeedbackTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref FeedbackTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowSesPublish
            Effect: Allow
            Principal:
              Service: ses.amazonaws.com
            Action: sns:Publish
            Resource: !Ref FeedbackTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  EventDestination:
    Type: AWS::SES::ConfigurationSetEventDestination
    # Topic policy must exist before SES starts publishing.
    DependsOn: FeedbackTopicPolicy
    Properties:
      ConfigurationSetName: !Ref ConfigurationSet
      EventDestination:
        Name: sns-bounce-complaint
        Enabled: true
        MatchingEventTypes:
          - BOUNCE
          - COMPLAINT
          # DELIVERY/OPEN/CLICK feed campaign stats. OPEN and CLICK additionally
          # need the configuration set's TrackingOptions; without a validated
          # CustomRedirectDomain SES uses its own awstrack.me domain, which works
          # but shows that host on link hover.
          - DELIVERY
          - OPEN
          - CLICK
        SnsDestination:
          TopicARN: !Ref FeedbackTopic

  # Creating this triggers a SubscriptionConfirmation POST to WebhookEndpoint,
  # which the live route auto-confirms after verifying the SNS signature.
  WebhookSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref FeedbackTopic
      Protocol: https
      Endpoint: !Ref WebhookEndpoint

  # --- EasyDKIM: 3 CNAMEs auto-added to the R53 zone ---
  Dkim1:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt Identity.DkimDNSTokenName1
      Type: CNAME
      TTL: "1800"
      ResourceRecords: [!GetAtt Identity.DkimDNSTokenValue1]
  Dkim2:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt Identity.DkimDNSTokenName2
      Type: CNAME
      TTL: "1800"
      ResourceRecords: [!GetAtt Identity.DkimDNSTokenValue2]
  Dkim3:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt Identity.DkimDNSTokenName3
      Type: CNAME
      TTL: "1800"
      ResourceRecords: [!GetAtt Identity.DkimDNSTokenValue3]

  # --- Custom MAIL FROM (mail.puchkaman.ca): MX + SPF for envelope alignment ---
  MailFromMx:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "${MailFromSubdomain}.${DomainName}"
      Type: MX
      TTL: "1800"
      ResourceRecords:
        - !Sub "10 feedback-smtp.${AWS::Region}.amazonses.com"
  MailFromSpf:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "${MailFromSubdomain}.${DomainName}"
      Type: TXT
      TTL: "1800"
      ResourceRecords:
        - '"v=spf1 include:amazonses.com ~all"'

Outputs:
  IdentityArn:
    Description: SES identity ARN — scope the instance-role ses:SendEmail policy to this.
    Value: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${DomainName}"
  ConfigurationSetName:
    Value: !Ref ConfigurationSet
  MailFromDomain:
    Value: !Sub "${MailFromSubdomain}.${DomainName}"
  FeedbackTopicArn:
    Description: Put this in the app env as SES_FEEDBACK_TOPIC_ARN (webhook defence in depth).
    Value: !Ref FeedbackTopic
