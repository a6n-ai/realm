AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Phase 2 — SES bounce/complaint feedback for tiffin-grab. A configuration set
  publishes BOUNCE + COMPLAINT events to an SNS topic, which POSTs to the app's
  signature-verified /api/webhooks/ses route. The route flips
  notification_prefs.suppressed for the affected user; the existing enqueue path
  (resolveChannels) then stops emailing that address. Deploy the webhook code to
  prod FIRST so SNS can auto-confirm the subscription on create.

Parameters:
  ConfigurationSetName:
    Type: String
    Default: tiffin-grab-prod
    Description: SES configuration set name. Put this in SSM SES_CONFIGURATION_SET, then redeploy the app.
  WebhookEndpoint:
    Type: String
    Default: https://app.tiffingrab.ca/api/webhooks/ses
    Description: HTTPS endpoint SNS delivers feedback to. Must be live before deploy (auto-confirm).
  TransactionalConfigurationSetName:
    Type: String
    Default: tiffin-grab-transactional
    Description: Config set for OTP/order mail, no open/click tracking. Put this in SSM SES_TRANSACTIONAL_CONFIGURATION_SET, then redeploy the app.
  TrackedConfigurationSetName:
    Type: String
    Default: tiffin-grab-transactional-tracked
    Description: Config set for tracked (open/click) transactional mail. Put this in SSM SES_TRACKED_CONFIGURATION_SET, then redeploy the app.
  RelaySesEventsTopicArn:
    Type: String
    Default: ""
    Description: ARN of Relay's relay-ses-events SNS topic in us-east-1 (output of deployment/aws/relay-ses-events.yaml). Empty = no Relay feed. Relay receives these sets' send, delivery, bounce, complaint and reject events, plus opens and clicks on the tracked sets.
  AlertEmail:
    Type: String
    Description: Address that gets the SES reputation alarm emails (confirm the SNS subscription mail once).
  TrackingDomain:
    Type: String
    Default: ""
    Description: >-
      Custom open/click tracking domain for the two tracked sets (empty = SES's shared awstrack.me).
      A one-level subdomain of a verified identity, CNAME to r.us-east-1.awstrack.me, Cloudflare-proxied
      with zone SSL "Full" (Universal SSL covers one level only). See README "Tracking domain".

Conditions:
  HasTrackingDomain: !Not [!Equals [!Ref TrackingDomain, ""]]
  HasRelayFeed: !Not [!Equals [!Ref RelaySesEventsTopicArn, ""]]

Resources:
  ConfigSet:
    Type: AWS::SES::ConfigurationSet
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Ref ConfigurationSetName
      TrackingOptions: !If
        - HasTrackingDomain
        - CustomRedirectDomain: !Ref TrackingDomain
          HttpsPolicy: REQUIRE
        - !Ref AWS::NoValue

  FeedbackTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: tiffin-grab-ses-feedback

  # SES must be allowed to publish to the topic; scope to this account.
  FeedbackTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref FeedbackTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowSesPublish
            Effect: Allow
            Principal:
              Service: ses.amazonaws.com
            Action: sns:Publish
            Resource: !Ref FeedbackTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  # Event destinations are owned by the app (Notifications > Email events) via
  # SESv2, which manages MatchingEventTypes. They were removed from this stack
  # with DeletionPolicy Retain, so they still exist in SES. To re-import, use
  # AWS::SES::ConfigurationSetEventDestination with these names:
  #   tiffin-grab-prod: sns-bounce-complaint, cloudwatch-campaign-counts
  #   tiffin-grab-transactional: sns-bounce-complaint, cloudwatch-transactional-counts
  #   tiffin-grab-transactional-tracked: sns-tracked-events, cloudwatch-tracked-counts

  # Creating this triggers a SubscriptionConfirmation POST to WebhookEndpoint,
  # which the live route auto-confirms (after verifying the SNS signature).
  WebhookSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref FeedbackTopic
      Protocol: https
      Endpoint: !Ref WebhookEndpoint

  # Transactional mail (OTP, orders) gets no OPEN/CLICK: SES adds a pixel and
  # rewrites every link through awstrack.me for those, a spam signal on OTPs.
  TransactionalConfigSet:
    Type: AWS::SES::ConfigurationSet
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Ref TransactionalConfigurationSetName

  # Event destinations on these sets are owned by the app from here on (it edits
  # them via the Worker); Retain keeps CloudFormation from deleting or replacing them.
  TrackedConfigSet:
    Type: AWS::SES::ConfigurationSet
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Ref TrackedConfigurationSetName
      TrackingOptions: !If
        - HasTrackingDomain
        - CustomRedirectDomain: !Ref TrackingDomain
          HttpsPolicy: REQUIRE
        - !Ref AWS::NoValue

  # Relay's feed on the three sets, beside TiffinGrab's own destinations (which the app manages via SESv2).
  # The name relay-ses-events is the one the app's event settings skip when it picks its own SNS destination.
  RelayEventsDestinationProd:
    Type: AWS::SES::ConfigurationSetEventDestination
    Condition: HasRelayFeed
    Properties:
      ConfigurationSetName: !Ref ConfigurationSetName
      EventDestination:
        Name: relay-ses-events
        Enabled: true
        MatchingEventTypes: [send, delivery, bounce, complaint, reject, deliveryDelay, renderingFailure, open, click]
        SnsDestination:
          TopicARN: !Ref RelaySesEventsTopicArn
  RelayEventsDestinationTransactional:
    Type: AWS::SES::ConfigurationSetEventDestination
    Condition: HasRelayFeed
    Properties:
      ConfigurationSetName: !Ref TransactionalConfigurationSetName
      EventDestination:
        Name: relay-ses-events
        Enabled: true
        MatchingEventTypes: [send, delivery, bounce, complaint, reject, deliveryDelay, renderingFailure]
        SnsDestination:
          TopicARN: !Ref RelaySesEventsTopicArn
  RelayEventsDestinationTracked:
    Type: AWS::SES::ConfigurationSetEventDestination
    Condition: HasRelayFeed
    Properties:
      ConfigurationSetName: !Ref TrackedConfigurationSetName
      EventDestination:
        Name: relay-ses-events
        Enabled: true
        MatchingEventTypes: [send, delivery, bounce, complaint, reject, deliveryDelay, renderingFailure, open, click]
        SnsDestination:
          TopicARN: !Ref RelaySesEventsTopicArn

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: tiffin-grab-ses-alerts
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  # Account-wide reputation. SES may review an account from 5% bounce or 0.1%
  # complaint and pause it at 10% / 0.5%; Gmail spam-folders from ~0.3%.
  BounceRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: tiffin-grab-ses-bounce-rate
      AlarmDescription: SES bounce rate above 2% - check the last campaign list.
      Namespace: AWS/SES
      MetricName: Reputation.BounceRate
      Statistic: Maximum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0.02
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  ComplaintRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: tiffin-grab-ses-complaint-rate
      AlarmDescription: SES complaint rate above 0.1% - SES review level, OTP mail at risk of spam folder.
      Namespace: AWS/SES
      MetricName: Reputation.ComplaintRate
      Statistic: Maximum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0.001
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

Outputs:
  ConfigurationSetName:
    Description: Set SSM /tiffin-grab/prod/SES_CONFIGURATION_SET to this, then redeploy.
    Value: !Ref ConfigSet
  TransactionalConfigurationSetName:
    Description: Set SSM /tiffin-grab/prod/SES_TRANSACTIONAL_CONFIGURATION_SET to this, then redeploy.
    Value: !Ref TransactionalConfigSet
  FeedbackTopicArn:
    Description: Optionally set SSM /tiffin-grab/prod/SES_FEEDBACK_TOPIC_ARN to this (webhook defense-in-depth).
    Value: !Ref FeedbackTopic
