AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Phase 2 — SES bounce/complaint feedback for tiffin-grab. A configuration set
  publishes BOUNCE + COMPLAINT events to an SNS topic, which POSTs to the app's
  signature-verified /api/webhooks/ses route. The route flips
  notification_prefs.suppressed for the affected user; the existing enqueue path
  (resolveChannels) then stops emailing that address. Deploy the webhook code to
  prod FIRST so SNS can auto-confirm the subscription on create.

Parameters:
  ConfigurationSetName:
    Type: String
    Default: tiffin-grab-prod
    Description: SES configuration set name. Put this in SSM SES_CONFIGURATION_SET, then redeploy the app.
  WebhookEndpoint:
    Type: String
    Default: https://app.tiffingrab.ca/api/webhooks/ses
    Description: HTTPS endpoint SNS delivers feedback to. Must be live before deploy (auto-confirm).
  TransactionalConfigurationSetName:
    Type: String
    Default: tiffin-grab-transactional
    Description: Config set for OTP/order mail, no open/click tracking. Put this in SSM SES_TRANSACTIONAL_CONFIGURATION_SET, then redeploy the app.
  TrackedConfigurationSetName:
    Type: String
    Default: tiffin-grab-transactional-tracked
    Description: Config set for tracked (open/click) transactional mail. Put this in SSM SES_TRACKED_CONFIGURATION_SET, then redeploy the app.
  AlertEmail:
    Type: String
    Description: Address that gets the SES reputation alarm emails (confirm the SNS subscription mail once).

Resources:
  ConfigSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: !Ref ConfigurationSetName

  FeedbackTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: tiffin-grab-ses-feedback

  # SES must be allowed to publish to the topic; scope to this account.
  FeedbackTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref FeedbackTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowSesPublish
            Effect: Allow
            Principal:
              Service: ses.amazonaws.com
            Action: sns:Publish
            Resource: !Ref FeedbackTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  EventDestination:
    Type: AWS::SES::ConfigurationSetEventDestination
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    # Topic policy must exist before SES starts publishing.
    DependsOn: FeedbackTopicPolicy
    Properties:
      ConfigurationSetName: !Ref ConfigSet
      EventDestination:
        Name: sns-bounce-complaint
        Enabled: true
        # Only what the app acts on: each SNS event wakes the Worker. A campaign
        # produced ~20k Delivery/Open/Click events; those go to CloudWatch below.
        MatchingEventTypes:
          - BOUNCE
          - COMPLAINT
        SnsDestination:
          TopicARN: !Ref FeedbackTopic

  # Campaign Delivered/Opened/Clicked: SES counts them per `campaign` message tag
  # (set on every campaign send) and the campaign page's Refresh results reads the
  # totals with GetMetricData. No per-recipient delivered/opened stamps for campaigns.
  MetricsEventDestination:
    Type: AWS::SES::ConfigurationSetEventDestination
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ConfigurationSetName: !Ref ConfigSet
      EventDestination:
        Name: cloudwatch-campaign-counts
        Enabled: true
        MatchingEventTypes:
          - DELIVERY
          - OPEN
          - CLICK
          - DELIVERY_DELAY
          - REJECT
          - RENDERING_FAILURE
        CloudWatchDestination:
          DimensionConfigurations:
            - DimensionName: campaign
              DimensionValueSource: messageTag
              DefaultDimensionValue: none

  # Creating this triggers a SubscriptionConfirmation POST to WebhookEndpoint,
  # which the live route auto-confirms (after verifying the SNS signature).
  WebhookSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref FeedbackTopic
      Protocol: https
      Endpoint: !Ref WebhookEndpoint

  # Transactional mail (OTP, orders) gets no OPEN/CLICK: SES adds a pixel and
  # rewrites every link through awstrack.me for those, a spam signal on OTPs.
  TransactionalConfigSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: !Ref TransactionalConfigurationSetName

  TransactionalEventDestination:
    Type: AWS::SES::ConfigurationSetEventDestination
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn: FeedbackTopicPolicy
    Properties:
      ConfigurationSetName: !Ref TransactionalConfigSet
      EventDestination:
        Name: sns-bounce-complaint
        Enabled: true
        # DELIVERY stays: invite, payment-reminder and renewal history show it per
        # message (~45/day). Delay/reject/rendering were webhook no-ops; see VDM.
        MatchingEventTypes:
          - BOUNCE
          - COMPLAINT
          - DELIVERY
        SnsDestination:
          TopicARN: !Ref FeedbackTopic

  # Event destinations on these sets are owned by the app from here on (it edits
  # them via the Worker); Retain keeps CloudFormation from deleting or replacing them.
  TransactionalCountsDestination:
    Type: AWS::SES::ConfigurationSetEventDestination
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ConfigurationSetName: !Ref TransactionalConfigSet
      EventDestination:
        Name: cloudwatch-transactional-counts
        Enabled: true
        MatchingEventTypes:
          - DELIVERY
        CloudWatchDestination:
          DimensionConfigurations:
            - DimensionName: campaign
              DimensionValueSource: messageTag
              DefaultDimensionValue: none

  TrackedConfigSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: !Ref TrackedConfigurationSetName

  TrackedWebhookDestination:
    Type: AWS::SES::ConfigurationSetEventDestination
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn: FeedbackTopicPolicy
    Properties:
      ConfigurationSetName: !Ref TrackedConfigSet
      EventDestination:
        Name: sns-tracked-events
        Enabled: true
        MatchingEventTypes:
          - SEND
          - DELIVERY
          - DELIVERY_DELAY
          - OPEN
          - CLICK
          - BOUNCE
          - COMPLAINT
          - REJECT
          - RENDERING_FAILURE
        SnsDestination:
          TopicARN: !Ref FeedbackTopic

  TrackedCountsDestination:
    Type: AWS::SES::ConfigurationSetEventDestination
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ConfigurationSetName: !Ref TrackedConfigSet
      EventDestination:
        Name: cloudwatch-tracked-counts
        Enabled: true
        MatchingEventTypes:
          - DELIVERY
          - OPEN
          - CLICK
        CloudWatchDestination:
          DimensionConfigurations:
            - DimensionName: campaign
              DimensionValueSource: messageTag
              DefaultDimensionValue: none

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: tiffin-grab-ses-alerts
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  # Account-wide reputation. SES may review an account from 5% bounce or 0.1%
  # complaint and pause it at 10% / 0.5%; Gmail spam-folders from ~0.3%.
  BounceRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: tiffin-grab-ses-bounce-rate
      AlarmDescription: SES bounce rate above 2% - check the last campaign list.
      Namespace: AWS/SES
      MetricName: Reputation.BounceRate
      Statistic: Maximum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0.02
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  ComplaintRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: tiffin-grab-ses-complaint-rate
      AlarmDescription: SES complaint rate above 0.1% - SES review level, OTP mail at risk of spam folder.
      Namespace: AWS/SES
      MetricName: Reputation.ComplaintRate
      Statistic: Maximum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0.001
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

Outputs:
  ConfigurationSetName:
    Description: Set SSM /tiffin-grab/prod/SES_CONFIGURATION_SET to this, then redeploy.
    Value: !Ref ConfigSet
  TransactionalConfigurationSetName:
    Description: Set SSM /tiffin-grab/prod/SES_TRANSACTIONAL_CONFIGURATION_SET to this, then redeploy.
    Value: !Ref TransactionalConfigSet
  FeedbackTopicArn:
    Description: Optionally set SSM /tiffin-grab/prod/SES_FEEDBACK_TOPIC_ARN to this (webhook defense-in-depth).
    Value: !Ref FeedbackTopic
