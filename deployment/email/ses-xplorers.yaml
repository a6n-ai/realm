AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  SES sending identity for xplorers.a6n.ai in ap-southeast-1 (must match the
  box region — SES identities are regional). EasyDKIM + custom MAIL FROM
  (mail.xplorers.a6n.ai). DKIM + MAIL FROM DNS records live in Cloudflare
  (deployment/cloudflare); copy the identity DKIM tokens there. Bounce/complaint SNS is omitted until https://xplorers.a6n.ai/api/webhooks/ses
  is live (SNS auto-confirm needs that route).

Parameters:
  DomainName:
    Type: String
    Default: xplorers.a6n.ai
  MailFromSubdomain:
    Type: String
    Default: mail
  ConfigurationSetName:
    Type: String
    Default: xplorers-prod
  ClientTag:
    Type: String
    Default: xplorers
    Description: Cost-allocation tag `client`. Same value as the prod stack.

Resources:
  Identity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref DomainName
      DkimSigningAttributes:
        NextSigningKeyLength: RSA_2048_BIT
      MailFromAttributes:
        BehaviorOnMxFailure: REJECT_MESSAGE
        MailFromDomain: !Sub "${MailFromSubdomain}.${DomainName}"
      ConfigurationSetAttributes:
        ConfigurationSetName: !Ref ConfigurationSet
      Tags:
        - Key: Name
          Value: xplorers-ses-identity
        - Key: client
          Value: !Ref ClientTag
        - Key: app
          Value: xplorers
        - Key: env
          Value: prod
        - Key: project
          Value: realm
  ConfigurationSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: !Ref ConfigurationSetName
      Tags:
        - Key: Name
          Value: xplorers-prod
        - Key: client
          Value: !Ref ClientTag
        - Key: app
          Value: xplorers
        - Key: env
          Value: prod
        - Key: project
          Value: realm
Outputs:
  IdentityArn:
    Description: SES identity ARN — scope the instance-role ses:SendEmail policy to this.
    Value: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${DomainName}"
  ConfigurationSetName:
    Value: !Ref ConfigurationSet
  MailFromDomain:
    Value: !Sub "${MailFromSubdomain}.${DomainName}"
