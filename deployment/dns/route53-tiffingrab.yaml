AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Route 53 public hosted zone for tiffingrab.ca, migrated from Hostinger DNS. Copies
  every record of the Hostinger zone export (2026-09-28) except Brevo (unused, dropped):
  Titan mailboxes, SES sending (DKIM + mail-from), the EC2 app subdomain, Hostinger FTP and
  the WordPress apex/www, so moving the registrar nameservers to this zone is
  non-disruptive.

  APEX: tiffingrab.ca and www point at the app box. Caddy there serves the app's public
  pages and proxies the WordPress admin paths to the Hostinger server (82.180.129.236,
  see deployment/prod/proxy/conf/Caddyfile); everything else redirects to app.

Parameters:
  AppIp:
    Type: String
    Default: "52.73.226.216"
    Description: Elastic IP of the shared EC2 box (app.tiffingrab.ca and the apex).

Resources:
  HostedZone:
    Type: AWS::Route53::HostedZone
    # Retain: deleting the stack must not drop the delegated zone (its NS set
    # would change on re-create, breaking the registrar delegation).
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: tiffingrab.ca

  # --- Website (apex + www): the app box; Caddy splits app pages / WordPress admin ---
  ApexA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: tiffingrab.ca
      Type: A
      TTL: 300
      ResourceRecords:
        - !Ref AppIp

  WwwCname:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: www.tiffingrab.ca
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - tiffingrab.ca

  # --- Titan Email (mailboxes: info@tiffingrab.ca receives here) ---
  ApexMx:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: tiffingrab.ca
      Type: MX
      TTL: 3600
      ResourceRecords:
        - "10 mx1.titan.email"
        - "20 mx2.titan.email"

  TitanDkim:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: titan1._domainkey.tiffingrab.ca
      Type: TXT
      TTL: 300
      ResourceRecords:
        - '"v=DKIM1; k=rsa; p=MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQCQ88svj2uPHmAFpFZRrLyS1l04ps4VVt4BWcF/rqaldaolitH+2AbbgjG9qRI6QxHNPWvN4UGZOEeS7gnU3mqqtVN9bIXT9FC5dVmm8UprC2SL7oP1caI/kTV1eEmBwe3QubnXtc2xLfMM6inDVWZdETejB5tH+G8DZNB4HRmv5QIDAQAB"'

  # --- Apex TXT: Titan SPF ---
  ApexTxt:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: tiffingrab.ca
      Type: TXT
      TTL: 14400
      ResourceRecords:
        - '"v=spf1 include:spf.titan.email ~all"'

  Dmarc:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: _dmarc.tiffingrab.ca
      Type: TXT
      TTL: 14400
      ResourceRecords:
        # Reports went to Brevo's collector (rua); Brevo is gone, so no report address.
        - '"v=DMARC1; p=none"'

  # --- SES (app email: invites, OTP, notifications). Identity tiffingrab.ca, EasyDKIM,
  #     custom MAIL FROM mail.tiffingrab.ca (deployment/email/ses-tiffin-grab.yaml). ---
  SesDkim1:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: sor35gqoewzgywsllpbzakykt3pqyajy._domainkey.tiffingrab.ca
      Type: CNAME
      TTL: 14400
      ResourceRecords:
        - sor35gqoewzgywsllpbzakykt3pqyajy.dkim.amazonses.com

  SesDkim2:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: pa6mtp44zgjhl2pdp3xyyyudcs4dksvr._domainkey.tiffingrab.ca
      Type: CNAME
      TTL: 14400
      ResourceRecords:
        - pa6mtp44zgjhl2pdp3xyyyudcs4dksvr.dkim.amazonses.com

  SesDkim3:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: 5gbh2fe32u6t5gvlgz5ctapoftrc4dyk._domainkey.tiffingrab.ca
      Type: CNAME
      TTL: 14400
      ResourceRecords:
        - 5gbh2fe32u6t5gvlgz5ctapoftrc4dyk.dkim.amazonses.com

  SesMailFromMx:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: mail.tiffingrab.ca
      Type: MX
      TTL: 14400
      ResourceRecords:
        - "10 feedback-smtp.us-east-1.amazonses.com"

  SesMailFromSpf:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: mail.tiffingrab.ca
      Type: TXT
      TTL: 14400
      ResourceRecords:
        - '"v=spf1 include:amazonses.com ~all"'

  # --- SES transactional sender notify.tiffingrab.ca (stack tiffin-grab-ses-notify),
  #     custom MAIL FROM mail.notify.tiffingrab.ca. Marketing stays on tiffingrab.ca. ---
  SesNotifyDkim1:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: rgpvcdn5tikweaxpji57ka7orksxmhys._domainkey.notify.tiffingrab.ca
      Type: CNAME
      TTL: 14400
      ResourceRecords:
        - rgpvcdn5tikweaxpji57ka7orksxmhys.dkim.amazonses.com

  SesNotifyDkim2:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: cay7flp6yp2hdbyj66sz5shhvgi6lw6g._domainkey.notify.tiffingrab.ca
      Type: CNAME
      TTL: 14400
      ResourceRecords:
        - cay7flp6yp2hdbyj66sz5shhvgi6lw6g.dkim.amazonses.com

  SesNotifyDkim3:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: zno5whc35fwyjnq5lvwcpks3z6khdxy2._domainkey.notify.tiffingrab.ca
      Type: CNAME
      TTL: 14400
      ResourceRecords:
        - zno5whc35fwyjnq5lvwcpks3z6khdxy2.dkim.amazonses.com

  SesNotifyMailFromMx:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: mail.notify.tiffingrab.ca
      Type: MX
      TTL: 14400
      ResourceRecords:
        - "10 feedback-smtp.us-east-1.amazonses.com"

  SesNotifyMailFromSpf:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: mail.notify.tiffingrab.ca
      Type: TXT
      TTL: 14400
      ResourceRecords:
        - '"v=spf1 include:amazonses.com ~all"'

  # --- The Realm app on EC2 ---
  AppA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: app.tiffingrab.ca
      Type: A
      TTL: 3600
      ResourceRecords:
        - !Ref AppIp

  # --- Hostinger FTP ---
  FtpA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: ftp.tiffingrab.ca
      Type: A
      TTL: 1800
      ResourceRecords:
        - "82.180.129.236"

Outputs:
  HostedZoneId:
    Description: Route 53 hosted zone id.
    Value: !Ref HostedZone
  NameServers:
    Description: >-
      Set these 4 as the custom nameservers in Hostinger (registrar Openprovider) to
      delegate tiffingrab.ca to Route 53. Only after deployment/dns/verify-tiffingrab.sh
      shows no differences.
    Value: !Join [", ", !GetAtt HostedZone.NameServers]
