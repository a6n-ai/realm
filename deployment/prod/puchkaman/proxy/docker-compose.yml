# Box B public ingress. One Caddy fronts puchkaman only (auto-TLS via Let's
# Encrypt), reaching puchkaman-web over the external `edge` network by name.
# Create the network once on the box:  docker network create edge
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env.production # provides $ACME_EMAIL to the Caddyfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount the DIRECTORY, never the file. A single-file bind mount binds that
      # file's inode, and `git pull` replaces the file rather than editing it in
      # place — so a long-lived container would read the original inode forever
      # and `caddy reload` would keep re-reading a stale copy. Mounting the dir
      # makes /etc/caddy/Caddyfile resolve fresh on every open, so a reload picks
      # up edits without recreating the container. conf/ holds only the Caddyfile
      # (compose file and .env.production stay outside it, unmounted).
      - ./conf:/etc/caddy:ro
      - caddy_data:/data # persists issued certs across restarts
      - caddy_config:/config
    networks:
      - edge

volumes:
  caddy_data:
  caddy_config:

networks:
  edge:
    external: true
