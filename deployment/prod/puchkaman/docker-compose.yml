# Puchkaman prod stack on its OWN box: web + redis + one-shot migrate,
# fronted by the Box B Caddy in ../proxy which reaches it as puchkaman-web:3000
# over `edge`. Redis only carries the outbox wake-up signal; web's outbox
# listener (instrumentation.ts, NOTIFY_LISTENER=on) sends — no worker container.
#
# Two images from deployment/prod/Dockerfile (--build-arg APP=puchkaman):
#   puchkaman-web   = runner target (Next standalone) → web
#   puchkaman-tools = build  target (source + drizzle-kit) → migrate
# Pin via IMAGE_TAG (CI sets it to the commit SHA); defaults to :latest.
# The database is Neon (moved from RDS 2026-10-03): web uses Neon's pooled
# endpoint, so there is no local pgbouncer.
include:
  - redis/docker-compose.yml

x-awslogs: &awslogs
  driver: awslogs
  options:
    awslogs-region: ${AWS_REGION:-us-east-1}
    awslogs-group: /puchkaman/prod
    awslogs-create-group: "true"

services:
  web:
    image: ${WEB_IMAGE:-ghcr.io/a6n-ai/puchkaman-web}:${IMAGE_TAG:-latest}
    container_name: puchkaman-web # stable hostname the Box B Caddy targets
    restart: unless-stopped
    logging: *awslogs
    env_file: .env.production
    environment:
      REDIS_URL: redis://redis:6379
      # Outbox listener: BLPOP on Redis, drain on signal, never polls Postgres.
      NOTIFY_LISTENER: "on"
      # Box B is a 1GB box: an unbounded Next.js heap can grow until the OOM
      # killer picks a container at random (it picked pgbouncer's DNS lookups
      # before this existed). Capping node's heap turns that into predictable
      # GC pressure in this container specifically, not a random kill.
      NODE_OPTIONS: "--max-old-space-size=384"
    mem_limit: 450m
    expose:
      - "3000" # internal only; the Box B Caddy is the sole public ingress
    networks:
      - default # reach redis in this project
      - edge # reached by the Box B Caddy in ../proxy
    depends_on:
      redis:
        condition: service_healthy

  # One-shot migration runner. Reuses the tools image (has drizzle-kit + source).
  # Never starts on `up` (tools profile); invoked by deploy.sh before up.
  migrate:
    image: ${TOOLS_IMAGE:-ghcr.io/a6n-ai/puchkaman-tools}:${IMAGE_TAG:-latest}
    logging: *awslogs
    env_file: .env.production
    environment:
      # Migrations bypass the pooler — drizzle-kit DDL + advisory lock need a
      # real session (Neon's direct endpoint, not -pooler).
      DATABASE_URL: ${DIRECT_DATABASE_URL}
    command: ["pnpm", "--filter", "puchkaman", "exec", "drizzle-kit", "migrate"]
    profiles:
      - tools

# Box B's own edge network — created once (`docker network create edge`) and
# joined by ../proxy's Caddy and this web service.
networks:
  edge:
    external: true
