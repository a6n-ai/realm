# Nested foundry/ + relay/ stay until EXTRACTION.md phase 4. All @foundry
# packages (including eslint-config) install from a6n-ai/foundry. Do not add
# foundry/pnpm-workspace.yaml here.
packages:
  - "apps/*"
  - "relay/apps/*"
  - "relay/packages/*"

# Git @foundry/* tarballs declare workspace:* on each other. Overrides turn
# those into github: path deps, which pnpm 11 treats as exotic subdeps unless
# this is off. Root package.json already pins the same a6n-ai/foundry tarball.
blockExoticSubdeps: false

overrides:
  # Git-hosted @foundry/* tarballs still declare workspace:* internals.
  # Point those at the same GitHub paths so install works after floor packages
  # leave the Realm workspace.
  "@foundry/commons": "github:a6n-ai/foundry#path:packages/commons"
  "@foundry/eslint-config": "github:a6n-ai/foundry#path:tooling/eslint-config"
  "@foundry/crm": "github:a6n-ai/foundry#path:packages/crm"
  "@foundry/database": "github:a6n-ai/foundry#path:packages/database"
  "@foundry/design-system": "github:a6n-ai/foundry#path:packages/design-system"
  "@foundry/email": "github:a6n-ai/foundry#path:packages/email"
  "@foundry/realtime": "github:a6n-ai/foundry#path:packages/realtime"
  "@foundry/themes": "github:a6n-ai/foundry#path:packages/themes"
  "@foundry/ui": "github:a6n-ai/foundry#path:packages/ui"
  "postcss@<8.5.23": ">=8.5.26"
  "esbuild@<0.25.0": ">=0.25.0"
  "@types/react": "19.2.18"
  "@types/react-dom": "19.2.5"
  "brace-expansion": "^1.1.18"
  "fast-uri": "^3.1.5"
  "ip-address": "^10.3.1"
  "js-yaml": "^4.3.1"
  "socket.io-parser": "^4.2.7"
  "undici": "^7.29.0"
  "hono": "^4.12.34"
  "@hono/node-server": "^1.19.15"

patchedDependencies:
  "@react-email/editor@1.5.10": "patches/@react-email__editor@1.5.10.patch"

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
