# @foundry/* from a6n-ai/foundry; @relay/* from a6n-ai/relay. Realm is apps
# only. Package sources live in sibling remotes, not nested copies.
packages:
  - "apps/*"

# Git tarballs declare workspace:* internals. Overrides turn those into
# github: path deps, which pnpm 11 treats as exotic subdeps unless this is off.
blockExoticSubdeps: false

overrides:
  "@foundry/commons": "github:a6n-ai/foundry#path:packages/commons"
  "@foundry/eslint-config": "github:a6n-ai/foundry#path:tooling/eslint-config"
  "@foundry/crm": "github:a6n-ai/foundry#path:packages/crm"
  "@foundry/database": "github:a6n-ai/foundry#path:packages/database"
  "@foundry/address": "github:a6n-ai/foundry#path:packages/address"
  "@foundry/delivery": "github:a6n-ai/foundry#path:packages/delivery"
  "@foundry/discounts": "github:a6n-ai/foundry#path:packages/discounts"
  "@foundry/coupons": "github:a6n-ai/foundry#path:packages/coupons"
  "@foundry/design-system": "github:a6n-ai/foundry#path:packages/design-system"
  "@foundry/email": "github:a6n-ai/foundry#path:packages/email"
  "@foundry/realtime": "github:a6n-ai/foundry#path:packages/realtime"
  "@foundry/themes": "github:a6n-ai/foundry#path:packages/themes"
  "@foundry/ui": "github:a6n-ai/foundry#path:packages/ui"
  "@relay/email": "github:a6n-ai/relay#path:packages/email"
  "@relay/engine": "github:a6n-ai/relay#path:packages/engine"
  "@relay/sdk": "github:a6n-ai/relay#path:packages/sdk"
  "@relay/sms": "github:a6n-ai/relay#path:packages/sms"
  "@relay/ui": "github:a6n-ai/relay#path:packages/ui"
  "@relay/whatsapp": "github:a6n-ai/relay#path:packages/whatsapp"
  "postcss@<8.5.23": ">=8.5.26"
  # One copy only: sonner keeps toasts in a module-level store, so a second copy
  # (relay's) toasts into a store the app's <Toaster> never reads.
  "sonner": "2.0.8"
  "esbuild@<0.25.0": ">=0.25.0"
  "@types/react": "19.3.0"
  "@types/react-dom": "19.3.0"
  "brace-expansion": "^1.1.18"
  "fast-uri": "^3.1.5"
  "ip-address": "^10.3.1"
  "js-yaml": "^4.3.1"
  "socket.io-parser": "^4.2.7"
  "undici": "^7.29.0"
  "hono": "^4.12.34"
  "@hono/node-server": "^1.19.15"
  "zod": "^4.6.7"
  # One copy only: two drizzle-orm copies make @foundry/database types incompatible.
  "drizzle-orm": "0.45.4"
  "stripe": "23.0.1"

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

minimumReleaseAgeExclude:
  - '@next/env@16.4.3'
  - '@next/swc-darwin-arm64@16.4.3'
  - '@next/swc-darwin-x64@16.4.3'
  - '@next/swc-linux-arm64-gnu@16.4.3'
  - '@next/swc-linux-arm64-musl@16.4.3'
  - '@next/swc-linux-x64-gnu@16.4.3'
  - '@next/swc-linux-x64-musl@16.4.3'
  - '@next/swc-win32-arm64-msvc@16.4.3'
  - '@next/swc-win32-x64-msvc@16.4.3'
  - next@16.4.3
  - '@next/eslint-plugin-next@16.4.3'
  - eslint-config-next@16.4.3
  - stripe@23.0.1
