# Nested foundry/ + relay/ stay until EXTRACTION.md phase 4. Leaf @foundry/*
# packages are excluded and installed from a6n-ai/foundry; floor packages stay
# workspace:*. Do not add foundry/pnpm-workspace.yaml here.
packages:
  - "apps/*"
  - "foundry/packages/*"
  - "!foundry/packages/ai"
  - "!foundry/packages/auth"
  - "!foundry/packages/auth-ui"
  - "!foundry/packages/clover"
  - "!foundry/packages/coupons"
  - "!foundry/packages/google-reviews"
  - "!foundry/packages/order-tracking"
  - "!foundry/packages/payments"
  - "!foundry/packages/places"
  - "!foundry/packages/routes"
  - "!foundry/packages/storage"
  - "!foundry/packages/wallet"
  - "foundry/tooling/*"
  - "relay/apps/*"
  - "relay/packages/*"

overrides:
  "postcss@<8.5.23": ">=8.5.26"
  "esbuild@<0.25.0": ">=0.25.0"
  "@types/react": "19.2.18"
  "@types/react-dom": "19.2.5"
  "brace-expansion": "^1.1.18"
  "fast-uri": "^3.1.5"
  "ip-address": "^10.3.1"
  "js-yaml": "^4.3.1"
  "socket.io-parser": "^4.2.7"
  "undici": "^7.29.0"
  "hono": "^4.12.34"
  "@hono/node-server": "^1.19.15"

patchedDependencies:
  "@react-email/editor@1.5.10": "patches/@react-email__editor@1.5.10.patch"

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
