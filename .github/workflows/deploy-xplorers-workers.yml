# xplorers on Cloudflare Workers (live since the 2026-11-02 cutover). Push to main deploys
# production; a manual run on main redeploys it. The preview Worker was removed on 2026-11-05.
#
# Repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, XPLORERS_DIRECT_DATABASE_URL (Neon
# production, direct).
name: deploy-xplorers-workers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/xplorers/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/deploy-worker.yml"
      - ".github/workflows/deploy-xplorers-workers.yml"

concurrency:
  group: deploy-xplorers
  cancel-in-progress: false

jobs:
  deploy:
    # Production only from main: it migrates the prod DB.
    if: github.ref == 'refs/heads/main'
    # deploy-worker.yml asks for id-token (tiffin-grab's AWS OIDC login); xplorers passes no role.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-worker.yml
    with:
      app: xplorers
      site-url: https://xplorers.a6n.ai
      wrangler-env: production
      # Neon production endpoint id (pooler and compute hosts share the prefix).
      db-host: ep-cold-salad-azc3uxye
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DIRECT_DATABASE_URL: ${{ secrets.XPLORERS_DIRECT_DATABASE_URL }}
