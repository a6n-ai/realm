# tiffin-grab on Cloudflare Workers. Manual only until the cutover (Task 15); EC2 stays live via
# deploy-tiffin-grab.yml until then. Add the push trigger at cutover, as in deploy-xplorers-workers.yml.
#
# Repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, TIFFIN_GRAB_DIRECT_DATABASE_URL (prod RDS,
# direct, migration user), TIFFIN_GRAB_PREVIEW_DIRECT_DATABASE_URL (realm-tiffin-grab-preview-db, direct).
name: deploy-tiffin-grab-workers

on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [preview, production]
        default: preview

concurrency:
  group: deploy-tiffin-grab-workers
  cancel-in-progress: false

jobs:
  deploy:
    # Production only from main: it migrates the prod DB.
    if: inputs.target == 'preview' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-worker.yml
    with:
      app: tiffin-grab
      site-url: ${{ inputs.target == 'preview' && 'https://next.tiffingrab.ca' || 'https://tiffingrab.ca' }}
      wrangler-env: ${{ inputs.target == 'preview' && 'preview' || 'production' }}
      db-host: ${{ inputs.target == 'preview' && 'realm-tiffin-grab-preview-db.caf2iueu67ew.us-east-1.rds.amazonaws.com' || 'realm-tiffin-grab-prod-db.caf2iueu67ew.us-east-1.rds.amazonaws.com' }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DIRECT_DATABASE_URL: ${{ inputs.target == 'preview' && secrets.TIFFIN_GRAB_PREVIEW_DIRECT_DATABASE_URL || secrets.TIFFIN_GRAB_DIRECT_DATABASE_URL }}
