# Foundry git-assert → Relay git-assert → apps typecheck.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Public repo: a committed secret is published the moment it is pushed.
  # Binary instead of gitleaks-action, which needs a paid license for org repos.
  # Full history scans in ~2s; reviewed false positives live in .gitleaksignore.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: |
          v=8.30.1
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_linux_x64.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_checksums.txt" | grep linux_x64 | sha256sum -c -
          tar xzf "gitleaks_${v}_linux_x64.tar.gz" gitleaks
          ./gitleaks git . --redact --no-banner

  foundry:
    name: Foundry git deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/assert-foundry-from-git.mjs
      # @foundry/* typecheck and test on a6n-ai/foundry CI.

  relay:
    name: Relay git deps
    needs: foundry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/assert-relay-from-git.mjs
      # @relay/* typecheck and test on a6n-ai/relay CI. The Relay operator
      # app lives in that repo, not here.

  apps:
    name: Realm apps
    needs: [relay, foundry]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Migration `when` values are written only by drizzle-kit generate; this
      # fails on an edited/back-dated/hand-typed one (silently skipped on deploy).
      - name: Check migration journals
        run: node scripts/check-migration-journal.mjs ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Structural conventions from konsistent.json: stray top-level files,
      # component file/export naming, schema barrels.
      - run: pnpm konsistent
      - run: pnpm turbo typecheck --filter=tiffin-grab --filter=xplorers
      # The live-DB vitest project needs Postgres + Redis, so CI runs only the pure
      # projects (job below); the db project runs locally before a push.

  app-unit-tests:
    name: tiffin-grab unit tests (${{ matrix.shard }}/3)
    needs: [relay, foundry]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `unit` + `unit-mocked` never reach Postgres or Redis (vitest.config sorts files by what they import).
      - run: pnpm --filter tiffin-grab exec vitest run --project unit --project unit-mocked --shard=${{ matrix.shard }}/3
