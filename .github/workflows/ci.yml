# Foundry git-assert → Relay git-assert → apps typecheck.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundry:
    name: Foundry git deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/assert-foundry-from-git.mjs
      # @foundry/* typecheck and test on a6n-ai/foundry CI.

  relay:
    name: Relay git deps
    needs: foundry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/assert-relay-from-git.mjs
      # @relay/* typecheck and test on a6n-ai/relay CI. The Relay operator
      # app lives in that repo, not here.

  apps:
    name: Realm apps
    needs: [relay, foundry]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo typecheck --filter=tiffin-grab --filter=puchkaman
      # App vitest talks to Postgres. Add a services: postgres job later; do not
      # fail this gate on an empty/no-DB vitest run.
