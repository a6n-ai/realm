name: cron-tiffin-grab

# Scheduler for tiffin-grab's protected cron routes, same shape as cron-puchkaman.yml.
# No abandoned-order sweep: unpaid orders stay open until staff cancel them
# (they send payment reminders instead).
#
# GitHub's schedule trigger is best-effort — a run can be delayed by several
# minutes under load, and very occasionally skipped. That is fine here: the
# pass is idempotent and windowed, so a late or missed run costs a delay,
# never a duplicate.
#
# The bearer must match the app's CRON_SECRET in prod. Without it the request
# is refused (the route is fail-closed), which surfaces here as a red run
# rather than as silence.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: cron-tiffin-grab
  cancel-in-progress: false

jobs:
  notifications:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger notifications pass
        env:
          CRON_SECRET: ${{ secrets.TIFFIN_GRAB_CRON_SECRET }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/response.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://app.tiffingrab.ca/api/cron/notifications)
          echo "HTTP ${code}"
          cat /tmp/response.json
          echo
          if [ "${code}" != "200" ]; then
            echo "::error::notifications returned HTTP ${code}"
            exit 1
          fi
