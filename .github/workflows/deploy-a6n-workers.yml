# a6n on Cloudflare Workers + D1. Push to main deploys production; a manual run on main redeploys it.
# Repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID. BETTER_AUTH_SECRET and RELAY_API_KEY are
# Worker secrets, set once with `wrangler secret put`.
name: deploy-a6n-workers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/a6n/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/deploy-a6n-workers.yml"

concurrency:
  group: deploy-a6n
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check migration journals
        run: node scripts/check-migration-journal.mjs ${{ github.event.before }}
      # build, migrate (d1 migrations apply --remote), deploy, verify; stops at the first failed step.
      - run: pnpm --filter a6n run deploy:apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
