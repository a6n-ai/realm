# One-off copy of TiffinGrab's email data into Relay (apps/tiffin-grab/scripts/relay-copy.ts).
# Manual only: it runs here because the owner's network proxy blocks scripted HTTPS to relay.a6n.ai.
# The script is idempotent and logs counts only. Delete this workflow after the cutover.
name: relay-copy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: copy (then verify) or verify only
        type: choice
        options: [copy, verify]
        default: copy

permissions:
  contents: read
  id-token: write

concurrency:
  group: relay-copy
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::947042607945:role/realm-github-deploy-tiffin-grab
          aws-region: us-east-1
      - name: Resolve DB URL
        run: |
          url=$(aws ssm get-parameter --name /tiffin-grab/prod/DIRECT_DATABASE_URL --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$url"
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"
      - name: Copy
        if: inputs.mode == 'copy'
        working-directory: apps/tiffin-grab
        env:
          RELAY_URL: https://relay.a6n.ai
          RELAY_API_KEY: ${{ secrets.RELAY_COPY_KEY }}
        run: pnpm exec tsx scripts/relay-copy.ts --mode=copy
      - name: Verify
        working-directory: apps/tiffin-grab
        env:
          RELAY_URL: https://relay.a6n.ai
          RELAY_API_KEY: ${{ secrets.RELAY_COPY_KEY }}
        run: pnpm exec tsx scripts/relay-copy.ts --mode=verify
